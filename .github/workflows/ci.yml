name: Validar PREDWEEM MULTISITIO

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compilar módulos activos
        run: |
          python -m py_compile \
            app.py \
            app_sanpedro_final.py \
            app_pronostico_multisitio.py \
            app_agotamiento_balcarce.py \
            app_fuente_hibrida.py \
            app_detalle_1pct.py \
            app_umbral_operativo.py \
            app_zoom_operativo.py \
            app_multisitio.py \
            app_multisitio_principal.py \
            predweem_core.py \
            sanpedro_calibracion_final.py \
            visualizacion_operativa.py \
            visualizacion_pulsos.py \
            update_meteo.py \
            update_meteo_core.py \
            update_meteo_runtime.py \
            config_multisitio.py \
            sitios_lolium.py

      - name: Ejecutar pruebas vigentes
        run: |
          python -m pytest \
            tests/test_multisitio_registry.py \
            tests/test_sanpedro_final.py \
            tests/test_update_meteo_runtime.py \
            tests/test_visualizacion_pulsos.py \
            -q

name: Garantizar horizonte meteorológico 7 días

on:
  workflow_dispatch:
  schedule:
    # Todos los días a las 09:00 de Argentina (12:00 UTC), después de la copia multisitio.
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: garantia-horizonte-7d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  garantizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas requests pytest

      - name: Completar y validar horizonte de siete días
        run: |
          python -c "from forecast_horizon import ensure_all_sites; ensure_all_sites()"
          python -m pytest tests/test_forecast_horizon.py -q

      - name: Guardar garantía de horizonte
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meteo_sitios data/estado_actualizacion_meteo.json

          if git diff --cached --quiet; then
            echo "Todos los sitios ya tenían siete días; no hay cambios para guardar."
            exit 0
          fi

          git commit -m "Garantiza horizonte meteorológico de 7 días"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
